name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Offline integration checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: integration
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: integration/package-lock.json
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - name: Install development tools
        run: npm ci --ignore-scripts
      - name: Audit development dependencies
        run: npm audit --audit-level=moderate
      - name: Prepare pinned reference host
        run: npm run prepare:upstream
      - name: Check types, lint, and formatting
        run: npm run check
      - name: Run offline tests
        run: npm test
      - name: Build standalone helper
        run: npm run build
      - name: Smoke-test package without authentication
        run: |
          ./dist/pdrive-integration version
          ./dist/pdrive-integration --help
          cmp ../LICENSE dist/LICENSE
          test -s dist/PROTON-LICENSE
          test -s dist/THIRD-PARTY-NOTICES
  checks:
    name: Documentation and workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Install documentation tools
        run: npm ci --ignore-scripts
      - name: Audit documentation dependencies
        run: npm audit --audit-level=moderate
      - name: Lint Markdown
        run: npm run lint:docs
      - name: Set up Go for actionlint
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: false
      - name: Validate GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
